# 桌面版（Electron）发布流水线
#
# 触发方式：推送 v* 标签（如 v3.2.0）或在 Actions 页面手动 workflow_dispatch。
# 产物：macOS（.dmg / .zip）与 Windows（.exe）安装包，推送标签时自动上传到对应 tag 的 GitHub Release。
#
# 注意：本流水线未配置任何代码签名 / 公证证书——
#   - macOS：首次打开需在 Finder 中右键 →「打开」（或在 系统设置 → 隐私与安全性 中允许）；
#   - Windows：安装/运行时会出现 SmartScreen 提示，需选择「仍要运行」。

name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建桌面安装包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      # 安装根依赖（electron / electron-builder 等 devDependencies）
      - run: npm install

      # 构建前端静态产物（frontend/out，会被打进桌面壳）
      - run: cd frontend && npm install && npm run build

      # better-sqlite3 原生模块在当前平台本地编译，electron-builder 打包时会按 Electron ABI 重建
      - run: cd backend && npm ci --omit=dev

      - name: 构建 macOS 安装包
        if: runner.os == 'macOS'
        run: npx electron-builder --config electron-builder.yml --mac

      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.yml --win

      # 仅推送标签时上传 Release；手动触发只产出构件（可在 Artifacts 中查看）
      - name: 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
